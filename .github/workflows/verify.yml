name: Verify shop
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: yii1_shop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, mbstring, fileinfo, gd, openssl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - name: Install disposable demo
        env:
          SHOP_ADMIN_EMAIL: demo@bazaarche.test
          SHOP_ADMIN_PASSWORD: BazaarcheTest123!
        run: |
          php tools/install.php
          php tools/seed.php
      - run: find protected tools public -name '*.php' -not -path '*/runtime/*' -print0 | xargs -0 -n1 php -l
      - run: php tools/verify-architecture.php && php tools/verify-commerce.php && php tools/verify-cms.php && php tools/verify-admin-tables.php && php tools/verify-category-tree.php && php tools/verify-hierarchy.php && php tools/verify-albums.php && php tools/verify-login-challenge.php && php tools/verify-jalali.php
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npm run test:race
      - run: npm run test:browser

      - name: MySQL gateway and inventory smoke
        env:
          SHOP_DSN: mysql:host=127.0.0.1;port=3306;dbname=yii1_shop;charset=utf8mb4
          SHOP_DB_USER: root
          SHOP_DB_PASSWORD: root
          SHOP_MYSQL_PASSWORD: root
          SHOP_ADMIN_EMAIL: demo@bazaarche.test
          SHOP_ADMIN_PASSWORD: BazaarcheTest123!
        run: |
          php tools/install.php
          php tools/seed.php
          php tools/verify-mysql.php
